kind = "api"
previewPath = "/api"
title = "CordChain API"
version = "1.1.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

# The canonical web backend is cordchain/api.py served by `run_api.sh` (uvicorn,
# port 5000). This manifest keeps the /api path prefix mapped to it so browser
# requests from the root dev URL reach the real FastAPI service instead of the
# legacy QA mirror.
[[services]]
localPort = 5000
name = "CordChain API"
paths = ["/api"]

[services.env]
PORT = "5000"

[services.development]
run = "bash run_api.sh"

[services.production]

[services.production.build]
args = ["pnpm", "store", "prune"]

[services.production.build.env]
CI = "true"

[services.production.run]
args = ["bash", "run_api.sh"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/docs"
